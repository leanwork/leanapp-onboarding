<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lean App · Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#15181d; --ink2:#4b5563; --muted:#9aa1ac;
  --line:#e7e9ee; --line2:#eef0f4; --hover:#f3f4f6; --black:#14171b;
  --sb:264px; --top:56px; --max:1060px;
  --shadow:0 1px 2px rgba(16,20,28,.05),0 1px 1px rgba(16,20,28,.04);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Figtree',system-ui,sans-serif;color:var(--ink);background:var(--bg);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em;line-height:1.15}
::selection{background:#15181d;color:#fff}

/* ===================== SIDEBAR ===================== */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sb);background:var(--panel);
  border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40}
.sb-logo{height:var(--top);display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line2);flex-shrink:0}
.sb-logo img{height:21px;width:auto}
.sb-logo .tag{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  border-left:1px solid var(--line);padding-left:9px;margin-left:1px}
.sb-scroll{overflow-y:auto;flex:1;padding:14px 12px 28px}
.sb-scroll::-webkit-scrollbar{width:8px}.sb-scroll::-webkit-scrollbar-thumb{background:#e2e5ea;border-radius:8px}
.sb-top{display:flex;flex-direction:column;gap:1px;margin-bottom:10px}
.sb-grp{margin-top:16px}
.sb-glabel{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#aab0ba;padding:6px 10px 4px}
.sb-item{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:500;color:var(--ink2);
  padding:7px 10px;border-radius:8px;cursor:pointer;position:relative}
.sb-item:hover{background:var(--hover);color:var(--ink)}
.sb-item.on{background:#15181d;color:#fff;font-weight:600}
.sb-item .dot{width:5px;height:5px;border-radius:50%;background:#cfd4db;flex-shrink:0}
.sb-item.on .dot{background:#fff}
.sb-item.home{font-weight:700;color:var(--ink)}
.sb-item.home.on{color:#fff}
.sb-sublabel{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#b3b9c2;padding:9px 10px 3px 14px}
.sb-item.sub{padding-left:22px;font-size:13px}
.sb-div{height:1px;background:var(--line2);margin:10px 8px}

/* ===================== TOPBAR ===================== */
.topbar{position:sticky;top:0;height:var(--top);background:rgba(244,245,247,.86);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 28px;z-index:30}
.menu-btn{display:none;width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;
  align-items:center;justify-content:center;cursor:pointer}
.menu-btn span{width:16px;height:2px;background:var(--ink);position:relative}
.menu-btn span::before,.menu-btn span::after{content:"";position:absolute;left:0;width:16px;height:2px;background:var(--ink)}
.menu-btn span::before{top:-5px}.menu-btn span::after{top:5px}
.top-title{font-weight:700;font-size:14.5px;white-space:nowrap}
.top-nav{margin-left:auto;display:flex;gap:4px}
.top-nav a{font-size:13px;font-weight:600;color:var(--ink2);padding:7px 13px;border-radius:8px}
.top-nav a:hover{background:#fff;color:var(--ink)}
.top-nav a.on{background:#15181d;color:#fff}

/* ===================== LAYOUT ===================== */
.main{margin-left:var(--sb);min-height:100vh}
#screen{max-width:var(--max);margin:0 auto;padding:30px 28px 90px}

/* ===================== HOME ===================== */
.hero{background:#15181d;color:#fff;border-radius:18px;padding:46px 44px;margin-bottom:34px}
.hero-kicker{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#9aa1ac;margin-bottom:16px}
.hero h1{font-size:42px;font-weight:800;letter-spacing:-.02em}
.hero h1 span{color:#fff;border-bottom:3px solid #fff;padding-bottom:1px}
.hero p{margin:14px 0 26px;color:#cfd3da;max-width:64ch;font-size:16px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;font-size:14px;font-weight:600;background:#fff;color:#15181d;
  padding:11px 20px;border-radius:10px;border:1px solid transparent;transition:transform .1s,box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.btn.ghost{background:transparent;color:#fff;border-color:#3a3f47}
.btn.ghost:hover{background:#22262c;box-shadow:none}

.sec-h{margin:34px 0 16px}
.sec-h h2{font-size:22px;font-weight:700}
.sec-h p{margin:4px 0 0;color:var(--ink2);font-size:14px}

.jrow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.jstage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.jstage-n{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.jstage-t{font-size:17px;font-weight:700;margin:6px 0 4px}
.jstage-d{font-size:12.5px;color:var(--ink2);min-height:34px}
.jstage-list{display:flex;flex-direction:column;gap:2px;margin-top:12px;border-top:1px solid var(--line2);padding-top:10px}
.jstage-list a{font-size:12.5px;color:var(--ink2);padding:3px 0}
.jstage-list a:hover{color:var(--ink);text-decoration:underline}

.home-grp{margin-bottom:26px}
.home-grp h3{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8b919c;
  padding-bottom:9px;border-bottom:1px solid var(--line);margin-bottom:16px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:14px}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;
  box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s,border-color .12s}
.fcard:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(16,20,28,.09);border-color:#d6dae1}
.fcard-t{font-size:16px;font-weight:700}
.fcard-d{font-size:13px;color:var(--ink2);margin:6px 0 14px;flex:1}
.fcard-foot{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;
  display:flex;justify-content:space-between;align-items:center}
.fcard-foot span{color:var(--ink)}

.home-foot{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:34px}
.foot-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s}
.foot-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(16,20,28,.09)}
.foot-k{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.foot-t{font-size:19px;font-weight:700;margin:6px 0 6px}
.foot-card p{margin:0;color:var(--ink2);font-size:13.5px}

/* ===================== PAGE / FEATURE ===================== */
.crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin-bottom:18px;flex-wrap:wrap}
.crumb a:hover{color:var(--ink)} .crumb i{font-style:normal;color:#cdd2d9} .crumb span{color:var(--ink2)}
.page-head{margin-bottom:24px}
.page-head h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
.page-head p{margin:8px 0 0;color:var(--ink2);max-width:70ch}

.feat-head{margin-bottom:26px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.feat-kicker{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.feat-head h1{font-size:34px;font-weight:800;letter-spacing:-.02em}
.feat-lead{margin:10px 0 18px;font-size:17px;color:var(--ink2);max-width:68ch}
.feat-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:600;color:var(--ink);
  background:#fff;border:1px solid var(--line);padding:5px 11px;border-radius:30px}
.badge.soft{color:var(--ink2);background:var(--hover);border-color:transparent}
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:#fff;border:1px solid var(--line);padding:5px 11px;border-radius:30px}
.lvl i{width:7px;height:7px;border-radius:50%;background:#dfe3e9}.lvl i.on{background:#15181d}
.lvl b{margin-left:3px;font-weight:600}

.feat-grid{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:34px;align-items:start}
.feat-main{min-width:0}
.block{margin-bottom:30px}
.block h2{font-size:18px;font-weight:700;margin-bottom:12px}
.block>p{margin:0;color:var(--ink2);font-size:15px}
.block-note{margin:-6px 0 14px!important;font-size:13px;color:var(--muted)!important}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:30px}
.two-col .block{margin-bottom:0}

.bul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.bul li{position:relative;padding-left:24px;font-size:14.5px;color:var(--ink2)}
.bul li::before{content:"";position:absolute;left:6px;top:9px;width:5px;height:5px;border-radius:50%;background:#c2c8d0}
.bul.check li::before,.bul.good li::before{content:"";left:4px;top:5px;width:11px;height:6px;border:2px solid #15181d;border-top:0;border-right:0;border-radius:0;background:none;transform:rotate(-45deg)}
.bul.bad li::before{content:"×";background:none;left:5px;top:-1px;width:auto;height:auto;font-size:16px;font-weight:700;color:#15181d}

.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.steps li{position:relative;padding-left:38px;font-size:14.5px;color:var(--ink2);min-height:26px;display:flex;align-items:center}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;
  background:#15181d;color:#fff;border-radius:8px;display:grid;place-items:center;font-size:12.5px;font-weight:700}

/* screenshots */
.shots{display:flex;flex-direction:column;gap:22px}
.shot{margin:0;cursor:zoom-in}
.shot-frame{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
.shot-frame img{display:block;width:100%;height:auto}
.shot-zoom{position:absolute;top:10px;right:10px;font-size:11px;font-weight:600;background:rgba(21,24,29,.82);color:#fff;
  padding:4px 9px;border-radius:20px;opacity:0;transition:opacity .15s}
.shot:hover .shot-zoom{opacity:1}
.shot figcaption{margin-top:9px;font-size:13px;color:var(--ink2)}
.shot-empty{border:1px dashed #cfd4db;border-radius:12px;background:repeating-linear-gradient(45deg,#fbfbfc,#fbfbfc 10px,#f4f5f7 10px,#f4f5f7 20px);
  padding:34px 24px;text-align:center;color:var(--muted);font-size:13.5px}

/* qa */
.qa{display:flex;flex-direction:column;gap:8px}
.qa-i{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.qa-i summary{list-style:none;cursor:pointer;padding:13px 16px;font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.qa-i summary::-webkit-details-marker{display:none}
.qa-i summary::after{content:"+";font-size:18px;font-weight:600;color:var(--muted)}
.qa-i[open] summary::after{content:"–"}
.qa-i p{margin:0;padding:0 16px 15px;font-size:13.5px;color:var(--ink2)}

/* aside */
.feat-aside{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(var(--top) + 22px)}
.side-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 17px;box-shadow:var(--shadow)}
.side-h{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.side-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line2)}
.side-row:last-child{border-bottom:0}.side-row span{color:var(--muted)}.side-row b{font-weight:600;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:12px;font-weight:500;color:var(--ink2);background:var(--hover);padding:5px 10px;border-radius:20px}
.side-resp{margin:0;font-size:13px;color:var(--ink2)}
.side-link{display:block;font-size:13.5px;color:var(--ink2);padding:7px 0;border-bottom:1px solid var(--line2)}
.side-link:last-child{border-bottom:0}.side-link:hover{color:var(--ink)}

/* primeiros passos */
.pp-bar{height:10px;background:#e7e9ee;border-radius:20px;overflow:hidden;margin-bottom:8px}
.pp-bar-fill{height:100%;width:0;background:#15181d;border-radius:20px;transition:width .3s ease}
.pp-bar-label{font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:26px}
.pp-list{display:flex;flex-direction:column;gap:16px}
.pp-stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow)}
.pp-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.pp-n{font-size:13px;font-weight:800;color:#fff;background:#15181d;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.pp-head h2{font-size:18px;font-weight:700}
.pp-head p{margin:2px 0 0;font-size:13px;color:var(--ink2)}
.pp-tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.step-task{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line2)}
.step-task:first-child{border-top:0}
.step-check{flex-shrink:0;width:22px;height:22px;border:2px solid #cfd4db;border-radius:7px;background:#fff;cursor:pointer;
  position:relative;transition:background .12s,border-color .12s;padding:0}
.step-check:hover{border-color:#15181d}
.step-task.done .step-check{background:#15181d;border-color:#15181d}
.step-check::after{content:"";position:absolute;left:5px;top:1px;width:6px;height:11px;border:2px solid #fff;border-top:0;border-left:0;
  transform:rotate(45deg) scale(0);transition:transform .12s}
.step-task.done .step-check::after{transform:rotate(45deg) scale(1)}
.step-txt{flex:1;font-size:14.5px;color:var(--ink);transition:color .12s}
.step-task.done .step-txt{color:var(--muted);text-decoration:line-through}
.step-link{font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap;padding:5px 11px;border:1px solid var(--line);border-radius:20px}
.step-link:hover{background:#15181d;color:#fff;border-color:#15181d}

/* faq search */
.faq-search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:11px;
  padding:0 14px;margin-bottom:14px;box-shadow:var(--shadow);color:var(--muted)}
.faq-search input{flex:1;border:0;outline:0;background:none;font-family:inherit;font-size:14.5px;color:var(--ink);padding:13px 0}
.faq-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.fchip{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink2);background:#fff;border:1px solid var(--line);
  padding:7px 13px;border-radius:20px;cursor:pointer;transition:background .12s,color .12s}
.fchip:hover{border-color:#cdd2d9}
.fchip.on{background:#15181d;color:#fff;border-color:#15181d}
.faq-empty{text-align:center;color:var(--muted);font-size:14px;padding:30px 0}
.script p{margin:0 0 12px;font-size:14.5px;color:var(--ink2)}.script b{color:var(--ink)}
.faq-sec{margin-bottom:24px}
.faq-sec h3{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8b919c;margin-bottom:12px}
.faq-sec .qa-i{margin-bottom:8px}
.faq-foot{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
  background:#15181d;color:#fff;border-radius:14px;padding:22px 26px;margin-top:20px}
.faq-foot p{margin:4px 0 0;color:#cfd3da;font-size:13.5px}.faq-foot b{font-size:16px}

/* ===================== GESTÃO (onde gerencio) ===================== */
.gx-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.gx-col{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 22px 8px;box-shadow:var(--shadow);overflow:hidden}
.gx-col::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.gx-col.lean::before{background:#15181d}
.gx-col.plat::before{background:#cfd4db}
.gx-col-head{display:flex;align-items:flex-start;gap:13px;padding-bottom:16px;border-bottom:1px solid var(--line2)}
.gx-ic{flex-shrink:0;width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.gx-col.lean .gx-ic{background:#15181d}
.gx-col.plat .gx-ic{background:#fff;border:1.5px solid #d3d8df}
.gx-sq{width:13px;height:13px;border-radius:3px;background:#fff}
.gx-sync{font-size:17px;font-weight:700;color:#8b919c;line-height:1}
.gx-col-tt{font-size:17px;font-weight:700;letter-spacing:-.01em}
.gx-col-tag{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.gx-col-desc{font-size:13px;color:var(--ink2);margin-top:7px}
.gx-list{list-style:none;margin:0;padding:0}
.gx-list li{display:flex;gap:11px;align-items:flex-start;font-size:14px;color:var(--ink);padding:12px 0;border-top:1px solid var(--line2)}
.gx-list li:first-child{border-top:0}
.gx-list li::before{content:"";flex-shrink:0;margin-top:6px;width:6px;height:6px;border-radius:50%;background:#c8cdd5}
.gx-col.lean .gx-list li::before{background:none;width:11px;height:6px;margin-top:4px;border:2px solid #15181d;border-top:0;border-right:0;border-radius:0;transform:rotate(-45deg)}

.gx-freq{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.gx-freq-row{display:flex;gap:16px;align-items:center;padding:16px 20px;border-top:1px solid var(--line2)}
.gx-freq-row:first-child{border-top:0}
.gx-fbadge{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.02em;padding:6px 13px;border-radius:30px;min-width:112px}
.gx-fbadge.high{background:#15181d;color:#fff}
.gx-fbadge.mid{background:#eef0f4;color:#15181d}
.gx-fbadge.low{background:#fff;color:#6b7280;border:1px solid var(--line)}
.gx-freq-body{min-width:0}
.gx-freq-items{font-size:14px;color:var(--ink)}
.gx-freq-note{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:3px}

.gx-tech{margin-top:30px;background:#fafbfc;border:1px solid var(--line);border-radius:16px;padding:26px 26px 28px}
.gx-tech-kicker{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);background:#fff;border:1px solid var(--line);padding:6px 12px;border-radius:30px}
.gx-tech h2{font-size:19px;font-weight:700;margin:16px 0 0}
.gx-tech-lead{margin:8px 0 0;font-size:14px;color:var(--ink2);max-width:74ch}
.gx-tech-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.gx-tech-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:19px 20px;box-shadow:var(--shadow)}
.gx-tech-card h3{font-size:15.5px;font-weight:700;margin-bottom:8px}
.gx-tech-card p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.6}
.gx-tech-sub{margin-top:16px;background:var(--hover);border:1px solid var(--line2);border-radius:10px;padding:14px 16px}
.gx-tech-sub-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin-bottom:11px}
.gx-tech-badges{gap:8px}
.gx-tech-badges li{font-size:13px;color:var(--ink)}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(12,14,18,.82);backdrop-filter:blur(4px);z-index:90;display:none;
  align-items:center;justify-content:center;padding:34px;flex-direction:column;gap:14px}
.lb.on{display:flex}
.lb img{max-width:min(1200px,94vw);max-height:82vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lb-cap{color:#e7e9ee;font-size:13.5px;max-width:70ch;text-align:center}
.lb-x{position:absolute;top:20px;right:24px;width:40px;height:40px;border-radius:50%;border:1px solid #3a3f47;
  background:#1c2026;color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center}

.sb-backdrop{display:none}

/* ===================== SITE FOOTER ===================== */
.site-foot{max-width:var(--max);margin:0 auto;padding:26px 28px 40px;border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.site-foot-in{display:flex;align-items:center;gap:14px}
.site-foot-tx{font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
.site-foot-in img{height:26px;width:auto;opacity:.9}
.site-foot-meta{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#b3b9c2}

/* ===================== RESPONSIVE ===================== */
@media(max-width:1040px){
  .feat-grid{grid-template-columns:1fr}.feat-aside{position:static;flex-direction:row;flex-wrap:wrap}
  .feat-aside .side-card{flex:1;min-width:220px}
  .jrow{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:860px){
  .sidebar{transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.18)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .sb-backdrop{display:block;position:fixed;inset:0;background:rgba(12,14,18,.4);z-index:35}
  .main{margin-left:0}
  .menu-btn{display:flex}
  .top-nav{display:none}
}
@media(max-width:680px){
  #screen{padding:22px 16px 70px}
  .hero{padding:32px 24px}.hero h1{font-size:30px}
  .home-foot,.two-col{grid-template-columns:1fr}
  .jrow{grid-template-columns:1fr}
  .gx-cols,.gx-tech-grid{grid-template-columns:1fr}
}

  <script>
/* screens.js */
/* ===========================================================================
   LEAN APP · Onboarding — TELAS (render hi-fi)
   =========================================================================== */
(function () {
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // Resource resolver: in bundled/standalone mode images live in window.__resources;
  // in dev mode they fall back to the img/ folder.
  const IMG = (name) => {
    const id = name.replace(/[^a-zA-Z0-9]/g, '_');
    return (window.__resources && window.__resources[id]) || ('img/' + name);
  };

  const crumb = (parts) => `<nav class="crumb">${parts.map((p) =>
    p.href ? `<a href="${p.href}">${esc(p.t)}</a>` : `<span>${esc(p.t)}</span>`).join('<i>/</i>')}</nav>`;

  const badge = (t, cls = '') => `<span class="badge ${cls}">${esc(t)}</span>`;
  const lvlDots = (lv) => { const n = LA.LEVELS[lv] || 1; return `<span class="lvl" title="${esc(lv)}">${[1,2,3].map((i)=>`<i class="${i<=n?'on':''}"></i>`).join('')}<b>${esc(lv)}</b></span>`; };

  const stepList = (arr) => `<ol class="steps">${arr.map((s) => `<li>${esc(s)}</li>`).join('')}</ol>`;
  const bullets = (arr, cls = '') => `<ul class="bul ${cls}">${arr.map((b) => `<li>${esc(b)}</li>`).join('')}</ul>`;

  function shots(f) {
    if (!f.imgs || !f.imgs.length) {
      return `<div class="shot-empty">Captura desta tela ainda não disponível — espaço reservado para screenshot, GIF ou vídeo curto.</div>`;
    }
    return `<div class="shots">${f.imgs.map((im) => `
      <figure class="shot" onclick="LAapp.lightbox('${IMG(im.src)}','${esc(im.cap)}')">
        <div class="shot-frame"><img loading="lazy" src="${IMG(im.src)}" alt="${esc(im.cap)}"><span class="shot-zoom">ampliar</span></div>
        <figcaption>${esc(im.cap)}</figcaption>
      </figure>`).join('')}</div>`;
  }

  function relatedLinks(f) {
    const sameGroup = LA.FEATURES.filter((x) => x.group === f.group && (f.sub ? x.sub === f.sub : true) && x.id !== f.id).slice(0, 5);
    if (!sameGroup.length) return '';
    return `<div class="side-card">
      <div class="side-h">Nesta seção</div>
      ${sameGroup.map((r) => `<a class="side-link" href="#/f/${r.id}">${esc(r.name)}</a>`).join('')}
    </div>`;
  }

  const SCREENS = {
    feature(id) {
      const f = LA.byId(id);
      if (!f) return `<div class="screen"><p>Funcionalidade não encontrada.</p><a href="#/home">Voltar ao início</a></div>`;
      const stage = LA.JOURNEY.find((s) => s.id === f.journey);
      const sec = (t, body, note) => `<section class="block"><h2>${esc(t)}</h2>${note ? `<p class="block-note">${esc(note)}</p>` : ''}${body}</section>`;

      return `<article class="screen feat">
        ${crumb([{ t: 'Início', href: '#/home' }, { t: f.group }, ...(f.sub ? [{ t: f.sub }] : []), { t: f.name }])}
        <header class="feat-head">
          <div class="feat-kicker">${esc(f.group)}${f.sub ? ' · ' + esc(f.sub) : ''}</div>
          <h1>${esc(f.name)}</h1>
          <p class="feat-lead">${esc(f.lead)}</p>
          <div class="feat-meta">
            ${lvlDots(f.level)}
            ${badge('Jornada · ' + stage.t)}
            ${badge(f.responsavel, 'soft')}
          </div>
        </header>

        <div class="feat-grid">
          <div class="feat-main">
            ${sec('O que é', `<p>${esc(f.oque)}</p>`)}
            ${sec('Quando utilizar', `<p>${esc(f.quando)}</p>`)}
            ${sec('A tela no painel', shots(f), 'Telas reais do painel administrativo. Clique para ampliar.')}
            ${sec('Benefícios para o negócio', bullets(f.beneficios, 'check'))}
            ${f.prereq && f.prereq.length ? sec('Pré-requisitos', bullets(f.prereq)) : ''}
            ${sec('Como configurar', stepList(f.configurar))}
            ${sec('Como utilizar no dia a dia', stepList(f.utilizar))}
            <div class="two-col">
              <section class="block"><h2>Boas práticas</h2>${bullets(f.praticas, 'good')}</section>
              <section class="block"><h2>Erros mais comuns</h2>${bullets(f.erros, 'bad')}</section>
            </div>
            ${f.faq && f.faq.length ? sec('Dúvidas frequentes', `<div class="qa">${f.faq.map((q) => `<details class="qa-i"><summary>${esc(q.q)}</summary><p>${esc(q.a)}</p></details>`).join('')}</div>`) : ''}
          </div>

          <aside class="feat-aside">
            <div class="side-card">
              <div class="side-h">Resumo</div>
              <div class="side-row"><span>Módulo</span><b>${esc(f.group)}</b></div>
              ${f.sub ? `<div class="side-row"><span>Submódulo</span><b>${esc(f.sub)}</b></div>` : ''}
              <div class="side-row"><span>Etapa</span><b>${esc(stage.t)}</b></div>
              <div class="side-row"><span>Nível</span><b>${esc(f.level)}</b></div>
            </div>
            <div class="side-card">
              <div class="side-h">Indicadores impactados</div>
              <div class="chips">${f.kpis.map((k) => `<span class="chip">${esc(k)}</span>`).join('')}</div>
            </div>
            <div class="side-card">
              <div class="side-h">Responsável recomendado</div>
              <p class="side-resp">${esc(f.responsavel)}</p>
            </div>
            ${relatedLinks(f)}
          </aside>
        </div>
      </article>`;
    },

    home() {
      const stages = LA.JOURNEY.map((st) => {
        const feats = LA.byJourney(st.id);
        return `<div class="jstage">
          <div class="jstage-n">${st.n}</div>
          <div class="jstage-t">${esc(st.t)}</div>
          <div class="jstage-d">${esc(st.d)}</div>
          <div class="jstage-list">${feats.slice(0, 6).map((f) => `<a href="#/f/${f.id}">${esc(f.name)}</a>`).join('')}</div>
        </div>`;
      }).join('');

      const groups = LA.GROUPS.map((g) => {
        const feats = LA.FEATURES.filter((f) => f.group === g);
        return `<section class="home-grp">
          <h3>${esc(g)}</h3>
          <div class="card-grid">${feats.map((f) => `
            <a class="fcard" href="#/f/${f.id}">
              <div class="fcard-t">${esc(f.name)}</div>
              <div class="fcard-d">${esc(f.lead)}</div>
              <div class="fcard-foot">${f.sub ? esc(f.sub) : esc(g)} <span>→</span></div>
            </a>`).join('')}</div>
        </section>`;
      }).join('');

      return `<div class="screen home">
        <section class="hero">
          <div class="hero-kicker">Onboarding · Lean App</div>
          <h1>Bem-vindo ao <span>Lean App</span></h1>
          <p>O guia oficial para configurar, operar e evoluir a sua operação no painel administrativo do Lean App. Use o menu lateral — ele espelha exatamente o seu painel.</p>
          <div class="hero-actions">
            <a class="btn" href="#/primeiros-passos">Primeiros passos</a>
            <a class="btn ghost" href="#/f/dashboard">Explorar o Dashboard</a>
          </div>
        </section>

        <section class="home-journey">
          <div class="sec-h"><h2>Sua jornada</h2><p>Quatro etapas, do zero à evolução contínua.</p></div>
          <div class="jrow">${stages}</div>
        </section>

        <div class="sec-h"><h2>Todos os módulos</h2><p>As ${LA.FEATURES.length} funcionalidades do painel, agrupadas como no produto.</p></div>
        ${groups}

        <section class="home-foot">
          <a class="foot-card" href="#/primeiros-passos">
            <div class="foot-k">Primeiros passos</div>
            <div class="foot-t">Roteiro de implantação</div>
            <p>Um checklist guiado, da configuração à evolução contínua.</p>
          </a>
          <a class="foot-card" href="#/faq">
            <div class="foot-k">FAQ</div>
            <div class="foot-t">Dúvidas frequentes</div>
            <p>Respostas rápidas, direto do material oficial da Leanwork.</p>
          </a>
        </section>
      </div>`;
    },

    start() {
      const stages = LA.START.map((st) => {
        const tasks = st.tasks.map((tk) => {
          const f = tk.fid ? LA.byId(tk.fid) : null;
          return `<li class="step-task" data-task="${esc(st.id + '|' + tk.t)}">
            <button class="step-check" type="button" aria-label="Marcar como concluído" onclick="LAapp.ppToggle(this)"></button>
            <span class="step-txt">${esc(tk.t)}</span>
            ${f ? `<a class="step-link" href="#/f/${f.id}">${esc(f.name)} →</a>` : ''}
          </li>`;
        }).join('');
        return `<section class="pp-stage">
          <div class="pp-head">
            <span class="pp-n">${st.n}</span>
            <div><h2>${esc(st.t)}</h2><p>${esc(st.goal)}</p></div>
          </div>
          <ul class="pp-tasks">${tasks}</ul>
        </section>`;
      }).join('');
      const totalTasks = LA.START.reduce((s, st) => s + st.tasks.length, 0);
      return `<div class="screen">
        ${crumb([{ t: 'Início', href: '#/home' }, { t: 'Primeiros passos' }])}
        <header class="page-head">
          <h1>Primeiros passos</h1>
          <p>Um roteiro prático de implantação, em ${totalTasks} tarefas e quatro etapas. Marque conforme avança — cada tarefa abre a funcionalidade correspondente. O progresso fica salvo neste navegador.</p>
        </header>
        <div class="pp-bar"><div class="pp-bar-fill" id="ppFill"></div></div>
        <div class="pp-bar-label" id="ppLabel"></div>
        <div class="pp-list">${stages}</div>
        <div class="faq-foot">
          <div><b>Precisa de ajuda na implantação?</b><p>Seu CSM Leanwork acompanha cada etapa com você.</p></div>
          <a class="btn" href="#/faq">Ver dúvidas frequentes</a>
        </div>
      </div>`;
    },

    gestao() {
      const G = LA.GESTAO;
      const col = (c) => `
        <section class="gx-col ${c.key === 'lean' ? 'lean' : 'plat'}">
          <div class="gx-col-head">
            <span class="gx-ic">${c.key === 'lean' ? '<span class="gx-sq"></span>' : '<span class="gx-sync">⇄</span>'}</span>
            <div class="gx-col-meta">
              <div class="gx-col-tt">${esc(c.title)}</div>
              <div class="gx-col-tag">${esc(c.tag)}</div>
              <div class="gx-col-desc">${esc(c.desc)}</div>
            </div>
          </div>
          <ul class="gx-list">${c.items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>
        </section>`;

      const freq = G.freq.map((r) => `
        <div class="gx-freq-row">
          <span class="gx-fbadge ${esc(r.cls)}">${esc(r.level)}</span>
          <div class="gx-freq-body">
            <div class="gx-freq-items">${esc(r.items)}</div>
            <div class="gx-freq-note">${esc(r.note)}</div>
          </div>
        </div>`).join('');

      const tech = G.tech.items.map((t) => `
        <div class="gx-tech-card">
          <h3>${esc(t.t)}</h3>
          <p>${esc(t.d)}</p>
          ${t.badges ? `
          <div class="gx-tech-sub">
            <div class="gx-tech-sub-h">${esc(t.badges.title)}</div>
            <ul class="bul check gx-tech-badges">${t.badges.items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>
          </div>` : ''}
        </div>`).join('');

      return `<div class="screen gx">
        ${crumb([{ t: 'Início', href: '#/home' }, { t: 'Gestão' }])}
        <header class="page-head">
          <div class="feat-kicker">Lean App × sua plataforma de e-commerce</div>
          <h1>Onde gerenciar cada coisa</h1>
          <p>${esc(G.intro)}</p>
        </header>

        <section class="block">
          <h2>Lean App × sua plataforma de e-commerce</h2>
          <p class="block-note">Dois ambientes, papéis diferentes. Veja o que vive em cada um.</p>
          <div class="gx-cols">${G.cols.map(col).join('')}</div>
        </section>

        <section class="block">
          <h2>Com que frequência você mexe em cada coisa?</h2>
          <p class="block-note">Ritmo de gestão no painel Lean App.</p>
          <div class="gx-freq">${freq}</div>
        </section>

        <section class="gx-tech">
          <div class="gx-tech-kicker">${esc(G.tech.kicker)}</div>
          <h2>${esc(G.tech.title)}</h2>
          <p class="gx-tech-lead">${esc(G.tech.lead)}</p>
          <div class="gx-tech-grid">${tech}</div>
        </section>

        <div class="faq-foot">
          <div><b>Ficou com dúvida sobre onde ajustar algo?</b><p>Seu CSM Leanwork ajuda a mapear cada ponto com o seu time.</p></div>
          <a class="btn" href="#/faq">Ver dúvidas frequentes</a>
        </div>
      </div>`;
    },

    faq() {
      const cats = [...new Set(LA.FAQ.map((q) => q.cat))];
      const blocks = cats.map((c) => `
        <section class="faq-sec" data-cat="${esc(c)}"><h3>${esc(c)}</h3>
          ${LA.FAQ.filter((q) => q.cat === c).map((q) => `
            <details class="qa-i" data-q="${esc((q.q + ' ' + q.a).toLowerCase())}"><summary>${esc(q.q)}</summary><p>${esc(q.a)}</p></details>`).join('')}
        </section>`).join('');
      return `<div class="screen">
        ${crumb([{ t: 'Início', href: '#/home' }, { t: 'FAQ' }])}
        <header class="page-head"><h1>Dúvidas frequentes</h1><p>${LA.FAQ.length} respostas extraídas do material oficial da Leanwork, organizadas por tema.</p></header>
        <div class="faq-search"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4-4"></path></svg><input id="faqInput" type="search" placeholder="Buscar por palavra-chave (ex.: vitrine, regionalização, selo…)" oninput="LAapp.faqSearch(this.value)" /></div>
        <div class="faq-chips" id="faqChips"><button class="fchip on" data-c="" onclick="LAapp.faqCat('')">Todas</button>${cats.map((c) => `<button class="fchip" data-c="${esc(c)}" onclick="LAapp.faqCat('${esc(c)}')">${esc(c)}</button>`).join('')}</div>
        <div id="faqBody">${blocks}</div>
        <div class="faq-empty" id="faqEmpty" style="display:none">Nenhuma pergunta encontrada. Tente outro termo.</div>
        <div class="faq-foot">
          <div><b>Não encontrou o que procurava?</b><p>Fale com o seu CSM Leanwork ou consulte a seção Suporte do painel.</p></div>
          <a class="btn" href="#/f/c-suporte">Configurar Suporte</a>
        </div>
      </div>`;
    },
  };

  window.SCREENS = SCREENS;
  window.LAesc = esc;
})();

  </script>
  <script>
  (function(){
    var esc = window.LAesc;

    /* ---- build sidebar nav mirroring the product ---- */
    function navItem(id, sub){
      var f = LA.byId(id); if(!f) return '';
      return '<a class="sb-item'+(sub?' sub':'')+'" data-fid="'+id+'" href="#/f/'+id+'">'+(sub?'':'<span class="dot"></span>')+esc(f.name)+'</a>';
    }
    function buildNav(){
      var html = LA.NAV.map(function(g){
        var inner = '<div class="sb-glabel">'+esc(g.group)+'</div>';
        (g.items||[]).forEach(function(id){ inner += navItem(id); });
        (g.subs||[]).forEach(function(s){ inner += '<div class="sb-sublabel">'+esc(s.name)+'</div>'; s.items.forEach(function(id){ inner += navItem(id,true); }); });
        (g.itemsAfter||[]).forEach(function(id){ inner += navItem(id); });
        (g.subsAfter||[]).forEach(function(s){ inner += '<div class="sb-sublabel">'+esc(s.name)+'</div>'; s.items.forEach(function(id){ inner += navItem(id,true); }); });
        return '<div class="sb-grp">'+inner+'</div>';
      }).join('');
      document.getElementById('sbnav').innerHTML = html;
    }

    function setActive(route, fid){
      document.querySelectorAll('[data-nav]').forEach(function(a){ a.classList.toggle('on', a.getAttribute('data-nav')===route); });
      document.querySelectorAll('[data-fid]').forEach(function(a){ a.classList.toggle('on', a.getAttribute('data-fid')===fid); });
    }

    /* ---- router ---- */
    function render(){
      var h = (location.hash||'#/home').replace(/^#\//,'');
      var parts = h.split('/').filter(Boolean);
      var route = parts[0]||'home', html='', navRoute='home', fid=null;
      if(route==='f'){ html = SCREENS.feature(parts[1]); fid=parts[1]; navRoute=''; }
      else if(route==='gestao'){ html = SCREENS.gestao(); navRoute='gestao'; }
      else if(route==='primeiros-passos'){ html = SCREENS.start(); navRoute='primeiros-passos'; }
      else if(route==='faq'){ html = SCREENS.faq(); navRoute='faq'; }
      else { html = SCREENS.home(); navRoute='home'; }
      document.getElementById('screen').innerHTML = html;
      setActive(navRoute, fid);
      if(route==='primeiros-passos') restorePP();
      document.body.classList.remove('nav-open');
      window.scrollTo(0,0);
    }

    /* ---- lightbox + primeiros passos + faq ---- */
    var PP_KEY='la_pp_done';
    function ppGet(){ try{ return JSON.parse(localStorage.getItem(PP_KEY)||'{}'); }catch(e){ return {}; } }
    function ppSet(o){ localStorage.setItem(PP_KEY, JSON.stringify(o)); }
    function ppUpdateBar(){
      var tasks=document.querySelectorAll('.step-task'); if(!tasks.length) return;
      var done=document.querySelectorAll('.step-task.done').length;
      var pct=Math.round(done/tasks.length*100);
      var fill=document.getElementById('ppFill'), lab=document.getElementById('ppLabel');
      if(fill) fill.style.width=pct+'%';
      if(lab) lab.textContent=done+' de '+tasks.length+' tarefas concluídas · '+pct+'%';
    }
    function restorePP(){
      var done=ppGet();
      document.querySelectorAll('.step-task').forEach(function(li){
        if(done[li.getAttribute('data-task')]) li.classList.add('done');
      });
      ppUpdateBar();
    }

    window.LAapp = {
      lightbox:function(src,cap){ document.getElementById('lb-img').src=src; document.getElementById('lb-cap').textContent=cap||''; document.getElementById('lb').classList.add('on'); },
      closeLb:function(e){ if(e&&e.target&&e.target.tagName==='IMG') return; document.getElementById('lb').classList.remove('on'); },
      ppToggle:function(btn){
        var li=btn.closest('.step-task'); li.classList.toggle('done');
        var done=ppGet(); var k=li.getAttribute('data-task');
        if(li.classList.contains('done')) done[k]=1; else delete done[k];
        ppSet(done); ppUpdateBar();
      },
      faqSearch:function(v){
        var term=(v||'').trim().toLowerCase();
        var any=false;
        document.querySelectorAll('#faqBody .qa-i').forEach(function(d){
          var hit=!term || d.getAttribute('data-q').indexOf(term)>=0;
          d.style.display=hit?'':'none';
          if(hit&&term){ d.open=true; } else if(!term){ d.open=false; }
          if(hit) any=true;
        });
        document.querySelectorAll('#faqBody .faq-sec').forEach(function(s){
          var vis=[...s.querySelectorAll('.qa-i')].some(function(d){ return d.style.display!=='none'; });
          s.style.display=vis?'':'none';
        });
        var em=document.getElementById('faqEmpty'); if(em) em.style.display=any?'none':'block';
        // reset category chips when searching
        if(term){ document.querySelectorAll('.fchip').forEach(function(c){ c.classList.toggle('on', c.getAttribute('data-c')===''); }); }
      },
      faqCat:function(cat){
        document.querySelectorAll('.fchip').forEach(function(c){ c.classList.toggle('on', c.getAttribute('data-c')===cat); });
        var inp=document.getElementById('faqInput'); if(inp) inp.value='';
        var any=false;
        document.querySelectorAll('#faqBody .qa-i').forEach(function(d){ d.style.display=''; d.open=false; });
        document.querySelectorAll('#faqBody .faq-sec').forEach(function(s){
          var show=!cat || s.getAttribute('data-cat')===cat;
          s.style.display=show?'':'none'; if(show) any=true;
        });
        var em=document.getElementById('faqEmpty'); if(em) em.style.display=any?'none':'block';
      }
    };
    document.addEventListener('keydown',function(e){ if(e.key==='Escape') LAapp.closeLb(); });

    buildNav();
    window.addEventListener('hashchange',render);
    render();
  })();
  </script>
</body>
</html>
